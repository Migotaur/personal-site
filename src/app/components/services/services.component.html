<section id="services" class="services"><div class="container">
  <div class="section-title"><h2>{{site.services.title}}</h2><p>{{site.services.subtitle}}</p></div>
  <div class="row">@for (item of site.services.items; track $index) {
    <div class="col-lg-4 col-md-6 d-flex align-items-stretch mb-4"><div class="icon-box">
      <div class="icon"><i [class]="item.icon"></i></div><h4>@if (item.url) {<a [href]="item.url">{{item.title}}</a>} @else { {{item.title}} }</h4><p>{{item.description}}</p>
    </div></div>
  }</div>
</div></section>
